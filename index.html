
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบแปลภาษามือเป็นเสียง</title>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: sans-serif;
      background: #f2f6ff;
      color: #24324a;
      text-align: center;
    }
    .screen { display: none; max-width: 600px; margin: auto; }
    .screen.active { display: block; }
    h1 { color: #3159a6; }
    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 20px;
      margin: 8px;
      font-size: 17px;
      background: #3867d6;
      color: white;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .panel {
      background: white;
      padding: 18px;
      margin: 16px 0;
      border-radius: 16px;
      box-shadow: 0 3px 12px #00000012;
    }
    video {
      width: 100%;
      max-width: 420px;
      border-radius: 12px;
      background: #222;
    }
    #result { font-size: 28px; font-weight: bold; color: #2457b5; }
    #status { white-space: pre-wrap; line-height: 1.6; }
  </style>
</head>

<body>
  <section id="home" class="screen active">
    <h1>ระบบแปลภาษามือเป็นเสียง</h1>
    <p>แปลท่ามือเป็นข้อความภาษาไทย</p>
    <button onclick="showScreen('select')">แปลภาษามือ</button>
  </section>

  <section id="select" class="screen">
    <h1>เริ่มแปลภาษามือ</h1>
    <div class="panel">
      <p>ใช้กล้องโทรศัพท์เพื่อแสดงท่ามือหน้ากล้อง</p>
      <button id="startButton" onclick="startCamera()">เปิดกล้องและเริ่มแปล</button>
      <button onclick="showScreen('home')">กลับหน้าหลัก</button>
    </div>
    <div class="panel">
      <video id="camera" autoplay playsinline muted></video>
      <p id="status">กดเปิดกล้องเพื่อเริ่มต้น</p>
      <p>ผลการแปล</p>
      <div id="result">ยังไม่พบท่ามือ</div>
      <button id="speakButton" onclick="speakResult()" disabled>🔊 อ่านออกเสียง</button>
      <button id="stopButton" onclick="stopCamera()">ปิดกล้อง</button>
    </div>
  </section>

  <script>
    const MODEL_URL =
      "https://teachablemachine.withgoogle.com/models/uYzdWo2E3/";

    let model = null;
    let stream = null;
    let running = false;
    let lastResult = "";
    let lastSpoken = "";
    let lastSpokenAt = 0;
    let predictionBusy = false;

    const $ = id => document.getElementById(id);

    function showScreen(name) {
      document.querySelectorAll(".screen").forEach(screen => {
        screen.classList.remove("active");
      });
      $(name).classList.add("active");
    }

    async function loadModel() {
      if (model) return;

      $("status").textContent = "กำลังโหลดโมเดล...";
      model = await tmImage.load(
        MODEL_URL + "model.json",
        MODEL_URL + "metadata.json"
      );
      $("status").textContent = "โหลดโมเดลสำเร็จ";
    }

    async function startCamera() {
      if (running) return;

      $("startButton").disabled = true;

      try {
        await loadModel();

        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: false
        });

        $("camera").srcObject = stream;
        await $("camera").play();

        running = true;
        $("status").textContent = "กำลังตรวจจับท่ามือ...";
        predictLoop();
      } catch (error) {
        $("status").textContent =
          "เปิดกล้องหรือโหลดโมเดลไม่สำเร็จ\n" + error.message;
        stopCamera();
      }
    }

    async function predictLoop() {
      if (!running || predictionBusy) return;

      predictionBusy = true;

      try {
        const predictions = await model.predict($("camera"));
        predictions.sort((a, b) => b.probability - a.probability);

        const best = predictions[0];

        if (best && best.probability >= 0.80) {
          lastResult = best.className;
          $("result").textContent = lastResult;
          $("speakButton").disabled = false;
          $("status").textContent =
            "ตรวจพบท่ามือ (" +
            (best.probability * 100).toFixed(1) + "%)";
        } else {
          $("status").textContent = "ยังไม่มั่นใจในท่ามือ ลองปรับมือหน้ากล้อง";
        }
      } catch (error) {
        $("status").textContent = "ตรวจจับไม่สำเร็จ: " + error.message;
      } finally {
        predictionBusy = false;
        if (running) setTimeout(predictLoop, 250);
      }
    }

    function speakResult() {
      if (!lastResult) {
        $("status").textContent = "ยังไม่มีข้อความให้อ่านออกเสียง";
        return;
      }

      if (!("speechSynthesis" in window)) {
        $("status").textContent = "เบราว์เซอร์นี้ไม่รองรับการอ่านออกเสียง";
        return;
      }

      const utterance = new SpeechSynthesisUtterance(lastResult);
      utterance.lang = "th-TH";
      utterance.rate = 0.9;

      speechSynthesis.cancel();
      speechSynthesis.speak(utterance);
    }

    function stopCamera() {
      running = false;
      predictionBusy = false;

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      $("camera").srcObject = null;
      $("startButton").disabled = false;
      $("status").textContent = "ปิดกล้องแล้ว";
    }

    window.addEventListener("pagehide", stopCamera);
  </script>
</body>
</html>
