<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">ด
  <title>ระบบแปลภาษามือเป็นเสียง</title>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f7ff;
      color: #172033;
    }

    .app {
      max-width: 500px;
      min-height: 100vh;
      margin: auto;
      padding: 25px 18px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    h1 {
      text-align: center;
      margin-top: 45px;
      font-size: 30px;
    }

    h2 {
      text-align: center;
      margin-top: 20px;
    }

    p {
      text-align: center;
      line-height: 1.6;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #3867ff;
      color: white;
    }

    button.secondary {
      background: #dfe6ff;
      color: #24366b;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .word-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    .word-button {
      margin: 0;
      background: white;
      color: #24304f;
      border: 2px solid #dce3f5;
    }

    .word-button.selected {
      background: #3867ff;
      color: white;
      border-color: #3867ff;
    }

    video {
      width: 100%;
      margin-top: 20px;
      border-radius: 18px;
      background: black;
    }

    .result {
      margin-top: 20px;
      padding: 20px;
      border-radius: 16px;
      background: white;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .status {
      margin-top: 15px;
      text-align: center;
      font-size: 15px;
    }

    .loading {
      text-align: center;
      margin-top: 25px;
    }
  </style>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
</head>

<body>

<div class="app">

  <!-- หน้าแรก -->
  <section id="home" class="screen active">
    <h1>🤟 ระบบแปลภาษามือเป็นเสียง</h1>

    <p>
      ระบบช่วยแปลภาษามือเป็นคำภาษาไทย
      และอ่านออกเสียงผ่านโทรศัพท์
    </p>

    <button onclick="showScreen('select')">
      แปลภาษามือ
    </button>
  </section>


  <!-- หน้าเลือกคำ -->
  <section id="select" class="screen">
    <h2>เลือกคำ</h2>

    <p>ระบบรองรับภาษามือทั้งหมด 10 คำ</p>

    <div id="wordGrid" class="word-grid"></div>

    <button id="confirmButton" disabled onclick="confirmWord()">
      ✓ ตกลง
    </button>

    <button class="secondary" onclick="showScreen('home')">
      ← กลับ
    </button>
  </section>


  <!-- หน้ากล้อง -->
  <section id="camera" class="screen">
    <h2>ทำท่าภาษามือ</h2>

    <p id="selectedText"></p>

    <div id="loading" class="loading">
      กำลังเตรียมระบบ...
    </div>

    <video id="video" autoplay playsinline></video>

    <button id="processButton" onclick="processGesture()" disabled>
      📸 ประมวลผล
    </button>

    <div id="result" class="result">
      รอการประมวลผล
    </div>

   

    <button class="secondary" onclick="resetApp()">
      🔄 เลือกคำใหม่
    </button>
  </section>

</div>


<script>

  // โมเดล Teachable Machine ของเรา
  const MODEL_URL =
    "https://teachablemachine.withgoogle.com/models/uYzdWo2E3/";

  // 10 คำที่ระบบรองรับ
  const words = [
    "สวัสดี",
    "ขอบคุณ",
    "ขอโทษ",
    "เสียใจ",
    "ชอบ",
    "รัก",
    "หิว",
    "ไม่สบาย",
    "โชคดี",
    "แล้วพบกันใหม่"
  ];

  let model = null;
  let webcamStream = null;
  let selectedWord = "";
  let lastResult = "";


  // สร้างปุ่ม 10 คำ
  const wordGrid = document.getElementById("wordGrid");

  words.forEach(word => {

    const button = document.createElement("button");

    button.className = "word-button";
    button.textContent = word;

    button.onclick = () => {

      document.querySelectorAll(".word-button")
        .forEach(b => b.classList.remove("selected"));

      button.classList.add("selected");

      selectedWord = word;

      document.getElementById("confirmButton")
        .disabled = false;
    };

    wordGrid.appendChild(button);
  });


  // เปลี่ยนหน้า
  function showScreen(id) {

    document.querySelectorAll(".screen")
      .forEach(screen => screen.classList.remove("active"));

    document.getElementById(id)
      .classList.add("active");
  }


  // เมื่อเลือกคำและกดตกลง
  async function confirmWord() {

    if (!selectedWord) return;

    document.getElementById("selectedText").textContent =
      "คำที่เลือก: " + selectedWord;

    showScreen("camera");

    await startCamera();
  }


  // เปิดกล้อง
  async function startCamera() {

    const video = document.getElementById("video");
    const loading = document.getElementById("loading");

    try {

      webcamStream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user"
        },
        audio: false
      });

      video.srcObject = webcamStream;

      await video.play();

      loading.textContent = "กำลังโหลด AI...";

      await loadModel();

      loading.textContent = "พร้อมแล้ว ทำท่าภาษามือได้เลย";

      document.getElementById("processButton")
        .disabled = false;

    } catch (error) {

      loading.textContent =
        "ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตการใช้กล้อง";

      console.error(error);
    }
  }


  // โหลดโมเดล
  async function loadModel() {

    if (model) return;

    model = await tmImage.load(
      MODEL_URL + "model.json",
      MODEL_URL + "metadata.json"
    );
  }


  // ประมวลผลภาพ
  async function processGesture() {

    if (!model || !selectedWord) return;

    const resultBox = document.getElementById("result");

    resultBox.textContent = "กำลังประมวลผล...";

    const predictions = await model.predict(
      document.getElementById("video")
    );

    // เรียงจากค่าความมั่นใจสูงสุด
    predictions.sort((a, b) => b.probability - a.probability);

    const prediction = predictions[0];

    const predictedWord = prediction.className;
    const confidence = prediction.probability;

    /*
      ต้องมั่นใจอย่างน้อย 80%
      และต้องตรงกับคำที่ผู้ใช้เลือก
    */

    if (
      confidence >= 0.80 &&
      predictedWord === selectedWord
    ) {

      lastResult = predictedWord;

      resultBox.innerHTML =
        "✅ ตรวจพบ<br><br>" +
        predictedWord;

      document.getElementById("")
        .disabled = false;

      speakResult();

    } else {

      lastResult = "";

      resultBox.innerHTML =
        "❌ ไม่สามารถจำแนกได้<br><br>" +
        "<small>กรุณาทำท่าใหม่ แล้วลองอีกครั้ง</small>";

      document.getElementById("speakButton")
        .disabled = true;
    }
  }


  // อ่านออกเสียงภาษาไทย
// อ่านออกเสียงภาษาไทย
  function speakResult() {
    if (!lastResult) {
      alert("ยังไม่มีข้อความให้อ่านออกเสียง");
      return;
    }

    if (
      !("speechSynthesis" in window) ||
      !("SpeechSynthesisUtterance" in window)
    ) {
      alert("เบราว์เซอร์ไม่รองรับการอ่านออกเสียง");
      return;
    }

    const synth = window.speechSynthesis;
    const speech = new SpeechSynthesisUtterance(lastResult);

    speech.lang = "th-TH";
    speech.rate = 0.9;

    const voices = synth.getVoices();
    const thaiVoice = voices.find(
      voice => voice.lang.toLowerCase().startsWith("th")
    );

    if (thaiVoice) {
      speech.voice = thaiVoice;
    }

    speech.onerror = function (event) {
      alert("อ่านออกเสียงไม่สำเร็จ: " + event.error);
    };

    synth.cancel(); 

speech.onstart = function () {
  alert("เริ่มอ่านออกเสียงแล้ว");
};
    
    synth.speak(speech);
  }


   // เริ่มใหม่
  function resetApp() {

    if (webcamStream) {

      webcamStream
        .getTracks()
        .forEach(track => track.stop());

      webcamStream = null;
    }


    selectedWord = "";
    lastResult = "";

    document.getElementById("confirmButton")
      .disabled = true;

    document.getElementById("processButton")
      .disabled = true;

    document.getElementById("speakButton")
      .disabled = true;

    document.querySelectorAll(".word-button")
      .forEach(b => b.classList.remove("selected"));

    document.getElementById("result").textContent =
      "รอการประมวลผล";

    showScreen("select");
  }

</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sign-language-app/service-worker.js");
  });
}
</script>
</body>
</html>
