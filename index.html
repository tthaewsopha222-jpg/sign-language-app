
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3157a4">
  <title>ระบบแปลภาษามือเป็นเสียง</title>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: sans-serif;
      background: #f0f4ff;
      color: #253452;
    }

    main {
      max-width: 540px;
      margin: auto;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    h1 { color: #3157a4; }
    .center { text-align: center; }

    .panel {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin: 16px 0;
      box-shadow: 0 4px 16px #172b4d12;
    }

    button {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px;
      margin: 10px 0;
      background: #3157a4;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button.secondary { background: #64748b; }
    button:disabled { opacity: .5; cursor: not-allowed; }

    video {
      display: block;
      width: 100%;
      background: #111827;
      border-radius: 12px;
      margin: 12px 0;
    }

    #result {
      font-size: 30px;
      font-weight: bold;
      color: #3157a4;
      overflow-wrap: anywhere;
    }

    #status {
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .small { font-size: 14px; color: #64748b; }
  </style>
</head>

<body>
<main>
  <section id="home" class="screen active center">
    <div class="panel">
      <h1>ระบบแปลภาษามือเป็นเสียง</h1>
      <p>เปลี่ยนท่ามือเป็นข้อความภาษาไทย</p>
      <button onclick="showScreen('translate')">
        แปลภาษามือ
      </button>
    </div>
  </section>

  <section id="translate" class="screen">
    <h1 class="center">แปลภาษามือ</h1>

    <div class="panel">
      <p id="status">กดปุ่มเพื่อเริ่มต้น</p>

      <button id="startButton" onclick="startCamera()">
        เปิดกล้องและเริ่มแปล
      </button>

      <video id="camera" autoplay playsinline muted></video>

      <p class="center">ผลการแปล</p>
      <div id="result" class="center">รอท่ามือ...</div>

      <button id="speakButton" onclick="speakResult()" disabled>
        🔊 อ่านออกเสียง
      </button>

      <button class="secondary" onclick="stopCamera()">
        ปิดกล้อง
      </button>

      <button class="secondary" onclick="goHome()">
        กลับหน้าหลัก
      </button>

      <p class="small">
        หมายเหตุ: ความแม่นยำขึ้นอยู่กับท่ามือและข้อมูลที่ใช้ฝึกโมเดล
      </p>
    </div>
  </section>
</main>

<script>
"use strict";

const MODEL_URL =
  "https://teachablemachine.withgoogle.com/models/uYzdWo2E3/";

let model = null;
let cameraStream = null;
let cameraRunning = false;
let lastResult = "";
let predictionBusy = false;
let predictionTimer = null;

const $ = id => document.getElementById(id);

function setStatus(message) {
  $("status").textContent = message;
}

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(screen => {
    screen.classList.remove("active");
  });

  $(id).classList.add("active");
}

function goHome() {
  stopCamera();
  showScreen("home");
}

async function loadModel() {
  if (model) return;

  if (!window.tmImage) {
    throw new Error("โหลดไลบรารีโมเดลไม่สำเร็จ กรุณาตรวจอินเทอร์เน็ต");
  }

  setStatus("กำลังโหลดโมเดล...");

  model = await tmImage.load(
    MODEL_URL + "model.json",
    MODEL_URL + "metadata.json"
  );

  setStatus("โหลดโมเดลสำเร็จ");
}

async function startCamera() {
  if (cameraRunning) return;

  if (!navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia) {
    setStatus("ไม่สามารถเปิดกล้องได้ กรุณาเปิดเว็บผ่าน HTTPS");
    return;
  }

  $("startButton").disabled = true;

  try {
    await loadModel();

    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" },
      audio: false
    });

    $("camera").srcObject = cameraStream;
    await $("camera").play();

    cameraRunning = true;
    setStatus("กล้องพร้อมแล้ว กำลังตรวจจับท่ามือ...");
    predictLoop();
  } catch (error) {
    stopCamera();
    setStatus("เริ่มระบบไม่สำเร็จ: " + error.message);
  } finally {
    $("startButton").disabled = cameraRunning;
  }
}

async function predictLoop() {
  if (!cameraRunning || predictionBusy) return;

  predictionBusy = true;

  try {
    const predictions = await model.predict($("camera"));

    predictions.sort((a, b) => b.probability - a.probability);
    const best = predictions[0];

    if (best && best.probability >= 0.80) {
      lastResult = best.className;
      $("result").textContent = lastResult;
      $("speakButton").disabled = false;

      setStatus(
        "ตรวจพบท่ามือ: " + lastResult +
        "\nความมั่นใจ: " +
        (best.probability * 100).toFixed(1) + "%"
      );
    } else {
      setStatus("ยังไม่มั่นใจในท่ามือ ลองจัดมือให้อยู่ในภาพ");
    }
  } catch (error) {
    setStatus("ตรวจจับไม่สำเร็จ: " + error.message);
  } finally {
    predictionBusy = false;

    if (cameraRunning) {
      predictionTimer = setTimeout(predictLoop, 300);
    }
  }
}

function speakResult() {
  const text = String(lastResult || "").trim();

  if (!text) {
    setStatus("ยังไม่มีข้อความให้อ่านออกเสียง");
    return;
  }

  if (!("speechSynthesis" in window) ||
      !("SpeechSynthesisUtterance" in window)) {
    setStatus("เบราว์เซอร์นี้ไม่รองรับการอ่านออกเสียง");
    return;
  }

  const synth = window.speechSynthesis;
  synth.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "th-TH";
  utterance.rate = 0.85;
  utterance.pitch = 1;
  utterance.volume = 1;

  utterance.onstart = () => {
    setStatus("กำลังอ่านออกเสียง: " + text);
  };

  utterance.onend = () => {
    setStatus("อ่านออกเสียงเสร็จแล้ว");
  };

  utterance.onerror = event => {
    setStatus("อ่านออกเสียงไม่สำเร็จ: " + event.error);
  };

  synth.speak(utterance);
}

function stopCamera() {
  cameraRunning = false;

  if (predictionTimer !== null) {
    clearTimeout(predictionTimer);
    predictionTimer = null;
  }

  if (cameraStream) {
    cameraStream.getTracks().forEach(track => track.stop());
    cameraStream = null;
  }

  $("camera").srcObject = null;
  $("startButton").disabled = false;
  $("speakButton").disabled = !lastResult;

  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }

  setStatus("ปิดกล้องแล้ว");
}

window.addEventListener("pagehide", stopCamera);
</script>
</body>
</html>
